name: Build dnsdist CDB

# Compiles dnsdist/blocklists.conf into blocklist.cdb + allowlist.cdb +
# allowlist-wildcard.cdb with cdbgen-rs (https://github.com/HellDarkK/cdbgen-rs)
# and publishes them as assets of the `cdb-latest` release. The DNS server pulls
# them with dnsdist-blocklist-sync.timer.
#
# Release assets rather than commits: the blocklist CDB is tens of MB and
# changes every day, which would bloat git history fast (GitHub rejects files
# >100 MB).

on:
  schedule:
    - cron: '30 17 * * *'   # 00:30 WIB
  push:
    branches: [main]
    paths:
      - 'dnsdist/**'
      - '.github/workflows/build-cdb.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the build to the cdb-latest release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-cdb
  cancel-in-progress: false

env:
  TAG: cdb-latest
  MIN_BLOCKED: 500000
  CDBGEN_VERSION: v0.1.5
  # cdbgen-rs has a fixed cache directory
  CDBGEN_CACHE: /var/cache/cdbgen-rs

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout dnsdist/
        uses: actions/checkout@v4
        with:
          sparse-checkout: dnsdist

      - name: Install cdbgen-rs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="cdbgen-rs-${CDBGEN_VERSION}-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          gh release download "$CDBGEN_VERSION" -R HellDarkK/cdbgen-rs \
            -p "$asset" -p "$asset.sha256"
          sed -i "s#dist/##" "$asset.sha256"
          sha256sum -c "$asset.sha256"
          sudo install -m 755 "$asset" /usr/local/bin/cdbgen-rs
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$CDBGEN_CACHE"

      # cdbgen-rs falls back to the last good copy when a source is down, so
      # keep its download cache (and the public suffix list) between runs.
      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /var/cache/cdbgen-rs
            cache
          key: cdbgen-sources-${{ github.run_id }}
          restore-keys: cdbgen-sources-

      - name: Build CDB
        run: |
          set -euo pipefail
          mkdir -p out
          python3 dnsdist/cdbgen-prepare prepare \
            --config dnsdist/blocklists.conf \
            --serve-dir "$RUNNER_TEMP/serve" \
            --base-url http://127.0.0.1:8900 \
            --out-dir out \
            --cache cache \
            --toml "$RUNNER_TEMP/cdbgen.toml" 2>&1 | tee out/build.log
          cat "$RUNNER_TEMP/cdbgen.toml"

          # local files (local-allow.txt, the public-suffix guard, ...) are
          # served over http because cdbgen-rs only fetches URLs
          python3 -m http.server 8900 --bind 127.0.0.1 --directory "$RUNNER_TEMP/serve" \
            >/dev/null 2>&1 &
          server=$!
          for _ in $(seq 50); do
            curl -fsS -o /dev/null http://127.0.0.1:8900/placeholder.txt && break
            sleep 0.1
          done

          # exit 3 = a source without cache was unreachable and its output was
          # skipped; don't publish a partial build
          set +e
          cdbgen-rs --config "$RUNNER_TEMP/cdbgen.toml" 2>&1 | tee -a out/build.log
          rc=${PIPESTATUS[0]}
          set -e
          kill "$server" || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::cdbgen-rs exited with $rc"
            exit "$rc"
          fi

          python3 dnsdist/cdbgen-prepare stats \
            --out-dir out --stats out/blocklist-stats.json \
            --log out/build.log --builder "cdbgen-rs $CDBGEN_VERSION" 2>&1 | tee -a out/build.log
          cat out/blocklist-stats.json

      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /var/cache/cdbgen-rs
            cache
          key: cdbgen-sources-${{ github.run_id }}

      - name: Sanity check
        env:
          DNSDIST_BLOCK_CDB: out/blocklist.cdb
          DNSDIST_ALLOW_CDB: out/allowlist.cdb
          DNSDIST_ALLOW_WILDCARD_CDB: out/allowlist-wildcard.cdb
        run: |
          n=$(jq .blocked_domains out/blocklist-stats.json)
          echo "blocked domains: $n"
          if [ "$n" -lt "$MIN_BLOCKED" ]; then
            echo "::error::only $n blocked domains (minimum $MIN_BLOCKED), not publishing"
            exit 1
          fi
          python3 dnsdist/dnsdist-blocklist-query doubleclick.net google.com adservice.google.com | tee check.txt
          grep -q '^doubleclick.net: BLOCKED' check.txt
          grep -q '^google.com: ALLOWED' check.txt
          # allowlist entries are exact: allowing google.com must not un-block its ad subdomains
          grep -q '^adservice.google.com: BLOCKED' check.txt

      - name: Upload build (not published)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: cdb-build
          path: out/
          retention-days: 3

      - name: Publish to release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum blocklist.cdb allowlist.cdb allowlist-wildcard.cdb blocklist-stats.json > SHA256SUMS

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --latest=false \
              --title "dnsdist CDB (latest build)" \
              --notes "Built automatically by .github/workflows/build-cdb.yml."
          fi

          # SHA256SUMS goes up last: a client that downloads while this step is
          # running sees a checksum mismatch and retries later, instead of
          # installing a blocklist and allowlist from two different builds.
          gh release upload "$TAG" blocklist.cdb allowlist.cdb allowlist-wildcard.cdb blocklist-stats.json build.log --clobber
          gh release upload "$TAG" SHA256SUMS --clobber

          gh release edit "$TAG" --notes "Built automatically by .github/workflows/build-cdb.yml with cdbgen-rs ${CDBGEN_VERSION}.

          - Built: $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}
          - Blocked domains: $(jq .blocked_domains blocklist-stats.json)
          - Allowed domains: $(jq .allowed_domains blocklist-stats.json)
          - Served from cache: $(jq -r '.served_from_cache | if length == 0 then "none" else join(", ") end' blocklist-stats.json)"
