# Public suffixes the guard in dnsdist-blocklist-build should ignore.
#
# Normally an entry for a public suffix is a mistake: because dnsdist matches
# by suffix, allowlisting one un-blocks every name beneath it, and blocklisting
# one takes out an entire platform. The guard drops them for that reason.
#
# Anything listed here opts out of that protection. Add a line only with a
# reason, and understand it applies to future names on that suffix too.

# Owner's decision, 2026-09-11: .co.id is a paid, document-verified Indonesian
# commercial suffix, so it is treated as an ordinary name and allowlisted.
# Consequence accepted at the time: this also un-blocks the 68 dlh<city>.co.id
# judol domains, the injected subdomains on compromised .co.id sites, the local
# ad networks (adplus.co.id, accesstrade.co.id) and the analytics endpoints
# (smetrics.sony.co.id and friends) -- and any .co.id judol registered later.
# Remove this line and rebuild to reverse it.
co.id
