# dnsdist blocklist sources -- migrated from AdGuard Home
# format:  <block|allow|blockfile|allowfile>  <name>  <url-or-path>
#
# The source of truth is dnsdist/ in github.com/cabrata/blacklist-hosts.
# Pushing a change there rebuilds the CDBs in GitHub Actions (build-cdb.yml) and
# publishes them to the cdb-latest release; the server picks them up hourly via
# dnsdist-blocklist-sync.timer. Relative file paths resolve next to this file.
# Manual fallback on the server:  dnsdist-blocklist-build

# ---- filters: 30 enabled, 10 disabled ----
# Order matters only for attribution: a domain carried by several lists is
# credited to the first one, and dns.caliph.dev sorts it into that list's
# category. Security lists therefore go first, and unified sits before the
# StevenBlack alternates (fake-news, gambling, porn), which each repeat all
# of unified -- otherwise its ~78k ad domains count as misinformation.
