# TrustPositif Indonesia: 3.09M domains across these four files, ~3.12M of them
# new. Held back on memory grounds. The build above peaked at 211 MB RSS for
# 1.08M unique domains -- about 196 bytes each -- so adding these would put the
# peak near 820 MB against the ~830 MB this box has free, with the VPN stack
# sharing it. That is not a margin worth betting a production server on.
# Nothing is lost for the case that prompted this: the Indonesian gambling
# names (dewapoker.com, judibola.com and the rest) are already covered by
# hagezi, nethserver-nl and trustpositif-au above. Only ~10% of TrustPositif-ID
# is covered by the other lists, but the remainder is overwhelmingly throwaway
# churn domains.
# To enable them, first rework the builder to collapse on disk (sort on the
# label-reversed names) instead of in memory.
#block	gambling-trustpositif-id-1	https://raw.githubusercontent.com/alsyundawy/TrustPositif/refs/heads/main/gambling_indonesia_001.txt
#block	gambling-trustpositif-id-2	https://raw.githubusercontent.com/alsyundawy/TrustPositif/refs/heads/main/gambling_indonesia_002.txt
#block	gambling-trustpositif-id-3	https://raw.githubusercontent.com/alsyundawy/TrustPositif/refs/heads/main/gambling_indonesia_003.txt
#block	gambling-trustpositif-id-4	https://raw.githubusercontent.com/alsyundawy/TrustPositif/refs/heads/main/gambling_indonesia_004.txt

# ---- allowlists, added 2026-09-11 ------------------------------------------
# TrustPositif's whitelists. The second URL as given (whitelis2.txt) 404s --
# the file in that repo is whitelist2.txt.
#
# These are written for a filtering system that blocks by IP and must not break
# major platforms, so they whitelist whole platform apexes. Allowlist entries
# are exact-match (since 2026-09-14): "google.com" un-blocks google.com itself,
# while adservice.google.com and the ad/telemetry endpoints on tiktok, msn,
# yahoo, amazon and x stay blocked. The build still drops public-suffix entries
# (web.app, cloudfront.net, r2.dev, ...).
allow	trustpositif-whitelist-1	https://raw.githubusercontent.com/alsyundawy/TrustPositif/refs/heads/main/whitelist.txt
allow	trustpositif-whitelist-2	https://raw.githubusercontent.com/alsyundawy/TrustPositif/refs/heads/main/whitelist2.txt
